<section id="certs" class="mt-24">
  <h2 class="text-3xl font-bold text-text-main dark:text-dark-text-main">
    Certifications
  </h2>

  <p class="mt-4 max-w-2xl text-text-muted dark:text-dark-text-muted">
    Certifications I am studying for, working on, or have completed.
  </p>

  <div class="mt-8 grid gap-6 md:grid-cols-3">
    @for (cert of visibleCerts; track cert.title) {
      <div class="overflow-hidden rounded-xl border border-gray-200 bg-surface dark:border-slate-800 dark:bg-dark-surface">
        <div class="relative h-56">
          <img
            [src]="certImage"
            [alt]="cert.title"
            class="h-full w-full object-cover"
          />

          <div class="absolute bottom-0 left-0 flex h-1/3 w-full flex-col justify-center bg-black/60 px-4 text-white">
            <h3 class="font-bold">
              {{ cert.title }}
            </h3>

            <p class="mt-1 text-sm text-gray-200">
              {{ cert.description }}
            </p>
          </div>
        </div>
      </div>
    }
  </div>

  @if (certs.length > 3) {
    <a
      href="/certs"
      class="mt-6 inline-block rounded-lg bg-primary px-5 py-2 text-white hover:bg-secondary dark:bg-dark-primary dark:text-dark-background dark:hover:bg-dark-secondary"
    >
      View all
    </a>
  }
</section>
