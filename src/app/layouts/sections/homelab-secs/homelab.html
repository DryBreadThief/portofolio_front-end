<section id="homelab" class="mt-24">
  <h2 class="text-3xl font-bold text-text-main dark:text-dark-text-main">
    Homelab
  </h2>

  <p class="mt-4 max-w-2xl text-text-muted dark:text-dark-text-muted">
    This section will document my homelab setup, servers, networking,
    virtualization, containers, security, and self-hosted services.
  </p>

  <div class="mt-8 grid gap-6 md:grid-cols-3">
    @for (item of visibleHomelabItems; track item.title) {
      <div class="rounded-lg bg-surface p-6 dark:bg-dark-surface">
        <h3 class="font-bold text-primary dark:text-dark-primary">
          {{ item.title }}
        </h3>

        <p class="mt-3 text-sm text-text-muted dark:text-dark-text-muted">
          {{ item.description }}
        </p>
      </div>
    }
  </div>

  @if (homelabItems.length > 3) {
    <a
      href="/homelab"
      class="mt-6 inline-block rounded-lg border border-primary px-5 py-2 text-primary hover:bg-surface dark:border-dark-primary dark:text-dark-primary dark:hover:bg-dark-surface"
    >
      View all
    </a>
  }
  
</section>
