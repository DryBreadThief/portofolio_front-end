<section id="experience" class="mt-24">
  <h2 class="text-3xl font-bold text-text-main dark:text-dark-text-main">
    Experience
  </h2>

  <p class="mt-4 max-w-2xl text-text-muted dark:text-dark-text-muted">
    A short overview of my work experience, technical practice, and learning path.
  </p>

  <div class="mt-8 grid gap-6 md:grid-cols-1">
    @for (experience of experiences; track experience.title) {
      <div class="rounded-lg bg-surface p-6 dark:bg-dark-surface">
        <h3 class="font-bold text-primary dark:text-dark-primary">
          {{ experience.title }}
        </h3>

        <p class="mt-1 text-sm text-text-muted dark:text-dark-text-muted">
          {{ experience.period }}
        </p>

        <p class="mt-3 text-sm text-text-muted dark:text-dark-text-muted">
          {{ experience.description }}
        </p>
      </div>
    }
  </div>

  @if (  experiences.length > 3  ) {
    <button
      type="button"
      class="mt-6 rounded-lg bg-primary px-5 py-2 text-white hover:bg-secondary dark:bg-dark-primary dark:text-dark-background dark:hover:bg-dark-secondary"
      (click)="showAllExperiences = !showAllExperiences"
    >
      {{ showAllExperiences ? 'Show less' : 'Show more' }}
    </button>
  }


</section>
