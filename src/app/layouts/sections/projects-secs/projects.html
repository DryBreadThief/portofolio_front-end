<section id="projects" class="mt-24">
  <h2 class="text-3xl font-bold text-text-main dark:text-dark-text-main">
    Projects
  </h2>

  <p class="mt-4 max-w-2xl text-text-muted dark:text-dark-text-muted">
    Software projects, experiments, and technical builds.
  </p>

  <div class="mt-8 grid gap-6 md:grid-cols-3">
    @for (project of visibleProjects; track project.title) {
      <div class="rounded-lg bg-surface p-6 dark:bg-dark-surface">
        <h3 class="font-bold text-primary dark:text-dark-primary">
          {{ project.title }}
        </h3>

        <p class="mt-3 text-sm text-text-muted dark:text-dark-text-muted">
          {{ project.description }}
        </p>
      </div>
    }
  </div>

  @if (projects.length > 3) {
    <a
      href="/projects"
      class="mt-6 inline-block rounded-lg bg-primary px-5 py-2 text-white hover:bg-secondary dark:bg-dark-primary dark:text-dark-background dark:hover:bg-dark-secondary"
    >
      View all
    </a>
  }
</section>
