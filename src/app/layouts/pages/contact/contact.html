<section class="px-6 py-20">
  <div class="mx-auto max-w-screen-xl">
    <h1 class="text-4xl font-bold text-primary dark:text-dark-primary">
      Contact
    </h1>

    <p class="mt-4 max-w-2xl text-text-muted dark:text-dark-text-muted">
      You can contact me for projects, collaboration, or questions about my work.
    </p>

    <div class="mt-10 max-w-xl rounded-xl bg-surface p-6 dark:bg-dark-surface">
      <div class="space-y-4">
        @if (loading) {
          <p class="text-sm text-text-muted dark:text-dark-text-muted">Loading contact details...</p>
        } @else if (error) {
          <p class="text-sm text-text-muted dark:text-dark-text-muted">{{ error }}</p>
        }

        @if (profile) {
          <div>
            <h2 class="font-bold text-text-main dark:text-dark-text-main">
              Email
            </h2>

            <a
              [href]="'mailto:' + profile.email"
              class="text-primary hover:text-secondary dark:text-dark-primary dark:hover:text-dark-secondary"
            >
              {{ profile.email }}
            </a>
          </div>

          <div>
            <h2 class="font-bold text-text-main dark:text-dark-text-main">
              GitHub
            </h2>

            <a
              [href]="profile.githubUrl"
              target="_blank"
              rel="noopener"
              class="text-primary hover:text-secondary dark:text-dark-primary dark:hover:text-dark-secondary"
            >
              View GitHub
            </a>
          </div>

          <div>
            <h2 class="font-bold text-text-main dark:text-dark-text-main">
              LinkedIn
            </h2>

            <a
              [href]="profile.linkedinUrl"
              target="_blank"
              rel="noopener"
              class="text-primary hover:text-secondary dark:text-dark-primary dark:hover:text-dark-secondary"
            >
              View LinkedIn
            </a>
          </div>
        }

      </div>
    </div>
  </div>
</section>
