<section class="px-6 py-20">
  <div class="mx-auto max-w-screen-xl">
    <h1 class="text-4xl font-bold text-primary dark:text-dark-primary">
      Projects
    </h1>

    <p class="mt-4 max-w-2xl text-text-muted dark:text-dark-text-muted">
      All my software projects, experiments, and technical builds.
    </p>

    <div class="mt-8 grid gap-6 md:grid-cols-3">
      @for (project of projects; track project.title) {
        <div class="rounded-lg bg-surface p-6 dark:bg-dark-surface">
          <h2 class="font-bold text-primary dark:text-dark-primary">
            {{ project.title }}
          </h2>

          <p class="mt-3 text-sm text-text-muted dark:text-dark-text-muted">
            {{ project.description }}
          </p>
        </div>
      }
    </div>
  </div>
</section>
